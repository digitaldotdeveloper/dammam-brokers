<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Dammam Warehouse Brokers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column, phone first. Slate header band, lime only for primary actions. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#eaeef2;
  --ink:#1b2530; --ink-2:#4a5c73; --ink-3:#7d8a9b; --line:#dde3ea;
  --band:#2f3d4e; --band-ink:#ffffff; --band-ink-2:#c4d0de;
  --lime:#b4da3c; --lime-ink:#1f2a08; --lime-text:#5f7d0e;
  --wa:#1f9d55; --wa-ink:#ffffff;
  --s-new:#7d8a9b; --s-noanswer:#c27c0e; --s-called:#2f6fb8; --s-interested:#1f9d55; --s-declined:#b8423a;
  --focus:#2f6fb8;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px; --r-sm:10px;
}
:root[dir="rtl"]{ --f-body:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,Tahoma,sans-serif; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11171e; --surface:#19212b; --surface-2:#222c38;
  --ink:#e8edf2; --ink-2:#a9b6c6; --ink-3:#7f8da0; --line:#2c3846;
  --band:#0c1218; --band-ink:#f3f6f9; --band-ink-2:#9fb0c3;
  --lime-text:#bfe24f; --wa:#25b463; --wa-ink:#06130b;
  --s-new:#8e9bad; --s-noanswer:#e2a33a; --s-called:#5e9be0; --s-interested:#3fc77a; --s-declined:#e2716a;
  --focus:#8fc0ff; color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
h1{font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--ink-3)}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}

.brand{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink-2);font-size:.82rem;letter-spacing:.04em;text-transform:uppercase}
.brand i{width:28px;height:4px;background:var(--lime);border-radius:2px;display:block}
.field{display:grid;gap:6px;min-width:0}
.field label,.label{font-size:.85rem;color:var(--ink-2);font-weight:500}
.input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-height:44px}
textarea.input{min-height:72px;resize:vertical}
.err{color:var(--s-declined);font-size:.9rem;margin:0}
.ok{color:var(--s-interested);font-size:.9rem;margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--lime);color:var(--lime-ink);border-color:transparent}
.btn-primary:hover{background:var(--lime);filter:brightness(.95)}
.btn-wa{background:var(--wa);color:var(--wa-ink);border-color:transparent}
.btn-wa:hover{background:var(--wa);filter:brightness(.95)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-sm{min-height:34px;padding:4px 10px;font-size:.85rem}
.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.lang{min-height:34px;padding:4px 12px;border-radius:999px;font-size:.85rem}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px}
.login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 22px;display:grid;gap:16px}
.login-top{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* Header band */
.band{background:var(--band);color:var(--band-ink)}
.band .wrap{padding-block:20px;display:grid;gap:10px}
.band-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.band-top .tools{display:flex;gap:6px;align-items:center}
.band .brand{color:var(--band-ink-2)}
.band h1{font-size:1.55rem}
.band p{margin:0;color:var(--band-ink-2);max-width:62ch}
.band .btn{background:transparent;color:var(--band-ink-2);border-color:rgba(255,255,255,.18)}
.band .btn:hover{color:var(--band-ink)}
.branch{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:.9rem;color:var(--band-ink-2)}
.branch b{color:var(--band-ink);font-weight:600}
.branch a{color:var(--lime);font-weight:600}

main .wrap{padding-block:20px 56px;display:grid;gap:26px}
section{display:grid;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px 12px;flex-wrap:wrap}
.hint{margin:0;color:var(--ink-2);font-size:.92rem;max-width:64ch}

/* Finder panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px}
.terms{display:flex;flex-wrap:wrap;gap:6px}
.term{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:.9rem;min-height:36px}
.term input{accent-color:var(--lime-text);margin:0}
.term:has(input:checked){border-color:var(--lime-text);background:var(--surface)}
.find-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.find-row .field{flex:0 0 auto}
.find-row select{min-height:44px}
.find-row .btn-primary{flex:1 1 200px;min-height:44px}
.progress{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--lime);transition:width .3s}
details.settings summary{cursor:pointer;color:var(--ink-2);font-size:.88rem;font-weight:500;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.settings summary::-webkit-details-marker{display:none}
details.settings summary::before{content:"⚙"}
.key-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.key-row .input{flex:1 1 240px}
.key-state{font-size:.85rem}

/* Chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;cursor:pointer;min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink-3));flex:none}
.chip .n{font-variant-numeric:tabular-nums;opacity:.75}

/* Add form */
details.add{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.add summary{cursor:pointer;padding:13px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.add summary::-webkit-details-marker{display:none}
details.add summary::after{content:"+";font-size:1.3rem;color:var(--lime-text)}
details.add[open] summary::after{content:"−"}
.add-form{display:grid;gap:12px;padding:0 16px 16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:540px){.row2{grid-template-columns:1fr}}

/* List */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .input{flex:1 1 200px;min-height:40px}
.toolbar select.input{flex:0 0 auto;width:auto}
.list{display:grid;gap:10px}
.office{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;border-inline-start:4px solid var(--c,var(--s-new))}
.office.top{border-color:var(--lime-text);border-inline-start-color:var(--c,var(--s-new))}
.office.top .actions .btn{min-height:48px;font-size:1rem}
.pick{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.03em;color:var(--lime-text);margin-bottom:2px}
.o-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.o-name{font-weight:700;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.o-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.85rem;color:var(--ink-3);margin-top:2px}
.o-meta .stars{color:var(--ink-2);font-weight:600}
.dist{font-weight:700;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.phone{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phone .num{font-size:1.05rem;font-weight:600;user-select:all}
.tag{font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.tag.fit{background:var(--lime);color:var(--lime-ink);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto}
.o-foot{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:start}
.o-foot select{min-height:38px;padding:4px 8px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2)}
.o-foot textarea{min-height:38px;padding:6px 10px}
@media (max-width:540px){.o-foot{grid-template-columns:1fr}}
.del{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-size:.85rem}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;display:grid;gap:6px}
.empty p{margin:0;color:var(--ink-2)}
.note{font-size:.85rem;color:var(--ink-3);margin:0}
.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
.toast span{background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}
</style>
</head>
<body>

<div id="loginView" class="wrap login">
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="login-top">
      <div class="brand"><i></i><span data-i18n="brand"></span></div>
      <button class="btn lang" type="button" data-lang-toggle></button>
    </div>
    <h1 style="font-size:1.4rem" data-i18n="appName"></h1>
    <div class="field"><label for="lu" data-i18n="user"></label><input class="input" id="lu" dir="ltr" autocapitalize="none" spellcheck="false"></div>
    <div class="field"><label for="lp" data-i18n="pass"></label><input class="input" id="lp" type="password" dir="ltr"></div>
    <p class="err" id="loginErr" data-i18n="loginErr" hidden></p>
    <button class="btn btn-primary" type="submit" data-i18n="signIn"></button>
  </form>
</div>

<div id="appView" hidden>
  <header class="band">
    <div class="wrap">
      <div class="band-top">

        <div class="tools">
          <button class="btn lang" type="button" data-lang-toggle></button>
          <button class="btn btn-sm" id="logout" type="button" data-i18n="signOut"></button>
        </div>

      <h1 data-i18n="h1"></h1>
      <p data-i18n="lead"></p>

      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section aria-labelledby="h-find">
        <h2 id="h-find" data-i18n="findH"></h2>
        <div class="panel">
          <p class="hint" data-i18n="findHint"></p>
          <div class="field">
            <span class="label" data-i18n="terms"></span>
            <div class="terms" id="terms"></div>
          </div>
          <div class="find-row">
            <div class="field">
              <label for="radius" data-i18n="within"></label>
              <select class="input" id="radius">
                <option value="2000">2 km</option>
                <option value="5000" selected>5 km</option>
                <option value="10000">10 km</option>
                <option value="20000">20 km</option>
              </select>
            </div>
            <button class="btn btn-primary" id="findBtn" type="button" data-i18n="findBtn"></button>
          </div>
          <div class="progress" id="progress" hidden><i id="progressBar"></i></div>
          <p class="note" id="findStatus" aria-live="polite"></p>
          <details class="settings" id="settings">
            <summary data-i18n="settings"></summary>
            <div class="field" style="margin-top:10px">
              <label for="apiKey" data-i18n="keyLabel"></label>
              <div class="key-row">
                <input class="input num" id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="AIza...">
                <button class="btn" id="saveKey" type="button" data-i18n="keySave"></button>
              </div>
              <p class="note" data-i18n="keyHint"></p>
              <p class="key-state" id="keyState"></p>
            </div>
          </details>
        </div>
      </section>

      <section aria-labelledby="h-list">
        <div class="sec-head">
          <h2 id="h-list" data-i18n="listH"></h2>
          <span class="muted" id="countLine"></span>
        </div>
        <div class="chips" id="filters" role="group"></div>
        <div class="toolbar">
          <input class="input" id="search" type="search" data-i18n-ph="searchPh">
          <select class="input" id="sort" aria-label="Sort">
            <option value="best" data-i18n="sortBest"></option>
            <option value="dist" data-i18n="sortDist"></option>
            <option value="rating" data-i18n="sortRating"></option>
            <option value="status" data-i18n="sortStatus"></option>
            <option value="recent" data-i18n="sortRecent"></option>
          </select>
          <button class="btn" id="exportBtn" type="button" data-i18n="export"></button>
        </div>
        <div class="list" id="list"></div>

        <details class="add" id="addBox">
          <summary data-i18n="addSummary"></summary>
          <form class="add-form" id="addForm">
            <div class="field"><label for="fName" data-i18n="fName"></label><input class="input" id="fName" required></div>
            <div class="row2">
              <div class="field"><label for="fPhone" data-i18n="fPhone"></label><input class="input num" id="fPhone" inputmode="tel" placeholder="05xxxxxxxx"></div>
              <div class="field"><label for="fArea" data-i18n="fArea"></label><input class="input" id="fArea"></div>
            </div>
            <div class="field"><label for="fMap" data-i18n="fMap"></label><input class="input num" id="fMap" placeholder="https://www.google.com/maps/place/...  /  26.40, 50.01"></div>
            <p class="note" data-i18n="mapHint"></p>
            <div class="field"><label for="fNotes" data-i18n="fNotes"></label><textarea class="input" id="fNotes"></textarea></div>
            <p class="err" id="addErr" hidden></p>
            <button class="btn btn-primary" type="submit" data-i18n="saveOffice"></button>
          </form>
        </details>
        <p class="note" data-i18n="storageNote"></p>
      </section>
    </div>
  </main>
</div>

<div class="toast" id="toast" hidden><span id="toastText"></span></div>

  /* ---------- helpers ---------- */
  function el(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
  function toLatin(s){ return String(s || '').replace(/[٠-٩]/g, function(d){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }).replace(/[۰-۹]/g, function(d){ return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); }); }
  function normPhone(p){
    var d = toLatin(p).replace(/[^\d]/g, '');
    if(!d) return '';
    if(d.indexOf('00') === 0) d = d.slice(2);
    if(d.indexOf('966') === 0) return d;
    if(d.indexOf('800') === 0 || d.indexOf('9200') === 0) return '966' + d;
    if(d.charAt(0) === '0') return '966' + d.slice(1);
    if(d.length === 9) return '966' + d;
    return d;
  }
  function isMobile(n){ return /^9665\d{8}$/.test(n); }
  function localPhone(n){
    if(/^966[15]\d{8}$/.test(n)) return '0' + n.slice(3);
    if(/^966(9200|800)/.test(n)) return n.slice(3);
    return n ? '+' + n : '';
  }
  function prettyPhone(n){
    var l = localPhone(n);
    if(/^0\d{9}$/.test(l)) return l.slice(0,3) + ' ' + l.slice(3,6) + ' ' + l.slice(6);
    return l;
  }
  function parseCoords(s){
    s = toLatin(s);
    var m = s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || s.match(/[?&](?:q|ll|query)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/) || s.match(/^\s*(-?\d{1,2}\.\d+)\s*[, ،]\s*(-?\d{1,3}\.\d+)\s*$/);
    if(!m) return null;
    var lat = +m[1], lng = +m[2];
    if(Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    return {lat:lat, lng:lng};
  }
  function km(a, b){
    var R = 6371, r = Math.PI/180, dLat = (b.lat-a.lat)*r, dLng = (b.lng-a.lng)*r;
    var h = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return 2*R*Math.asin(Math.sqrt(h));
  }
  function distOf(o){ return (typeof o.lat === 'number' && typeof o.lng === 'number') ? km(BRANCH, o) : null; }
  function isFit(o){ return FIT_RE.test((o.name || '') + ' ' + (o.address || '')); }
  function score(o){
    var d = distOf(o), s = 0;
    if(o.rating) s += o.rating * Math.log10((o.reviews || 0) + 1) * 2;
    if(isFit(o)) s += 6;
    if(o.phone) s += 3;
    if(d != null) s -= d * 0.6;
    return s;
  }
  function statusOf(id){ for(var i=0;i<STATUSES.length;i++) if(STATUSES[i].id === id) return STATUSES[i]; return STATUSES[0]; }
  function persist(){ if(!ls(K_DATA, JSON.stringify(offices))){ toast(t('eStore')); return false; } return true; }
  var toastTimer;
  function toast(msg){ $('toastText').textContent = msg; $('toast').hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function(){ $('toast').hidden = true; }, 2400); }
  function selectText(node){ try{ var r = document.createRange(); r.selectNodeContents(node); var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(t('selected')); }catch(e){} }

  /* ---------- Google Places search ---------- */
  function renderTerms(){
    var box = $('terms'); box.innerHTML = '';
    TERMS.forEach(function(term, i){
      var l = el('label','term'); l.lang = /[a-z]/i.test(term.q) ? 'en' : 'ar';

  function renderKeyState(){

  function placesPage(key, body){
    return fetch('https://places.googleapis.com/v1/places:searchText', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'X-Goog-Api-Key':key, 'X-Goog-FieldMask':FIELDS},
      body:JSON.stringify(body)
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){
        if(!r.ok){ var err = new Error((j.error && j.error.message) || ('HTTP ' + r.status)); err.status = r.status; throw err; }
        return j;
      });
    }, function(){ var err = new Error('network'); err.status = 0; throw err; });
  }
  function wait(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }

  function mergePlace(p, term, found){
    if(p.businessStatus === 'CLOSED_PERMANENTLY' || !p.location) return;
    var id = 'g_' + p.id;
    var rec = {
      name:(p.displayName && p.displayName.text) || '',
      phone:normPhone(p.internationalPhoneNumber || p.nationalPhoneNumber || ''),
      address:p.shortFormattedAddress || p.formattedAddress || '',
      lat:p.location.latitude, lng:p.location.longitude,
      rating:p.rating || null, reviews:p.userRatingCount || 0,
      mapUrl:p.googleMapsUri || '', website:p.websiteUri || '',
      source:'google'
    };
    var prev = offices[id];
    if(!prev){ found.added++; rec.status = 'new'; rec.notes = ''; rec.createdAt = Date.now(); rec.terms = [term]; offices[id] = rec; }
    else {
      var terms = prev.terms || []; if(terms.indexOf(term) === -1) terms.push(term);
      offices[id] = Object.assign({}, prev, rec, {status:prev.status, notes:prev.notes, terms:terms});
    }
    found.ids[id] = true;
  }

  $('findBtn').addEventListener('click', function(){
    if(searching) return;
    var key = ls(K_KEY);
    var st = $('findStatus'); st.className = 'note';
    if(!key){ st.textContent = t('needKey'); st.className = 'err'; $('settings').open = true; $('apiKey').focus(); return; }
    var terms = TERMS.filter(function(x){ return x.on; }).map(function(x){ return x.q; });
    if(!terms.length) return;
    var radius = +$('radius').value, rKm = radius / 1000;
    var found = {added:0, ids:{}};
    var steps = terms.length * 3, done = 0;
    searching = true; $('findBtn').disabled = true; $('progress').hidden = false; $('progressBar').style.width = '4%';

    var chain = Promise.resolve();
    terms.forEach(function(term){
      chain = chain.then(function(){
        var page = 0, token = null;
        function next(){
          st.textContent = t('searching', {q:term, n:Object.keys(found.ids).length});
          var body = {textQuery:term, languageCode:lang, regionCode:'SA', pageSize:20,
            locationBias:{circle:{center:{latitude:BRANCH.lat, longitude:BRANCH.lng}, radius:Math.min(radius * 1.5, 50000)}}};
          if(token) body.pageToken = token;
          return placesPage(key, body).then(function(j){
            (j.places || []).forEach(function(p){
              var d = p.location ? km(BRANCH, {lat:p.location.latitude, lng:p.location.longitude}) : 99;
              if(d <= rKm) mergePlace(p, term, found);
            });
            page++; done++;
            $('progressBar').style.width = Math.min(96, Math.round(done / steps * 100)) + '%';
            token = j.nextPageToken;
            if(token && page < 3) return wait(400).then(next);
            done += 3 - page;
          });
        }
        return next();
      });
    });

    chain.then(function(){
      persist();
      var n = Object.keys(found.ids).length;
      st.textContent = n ? t('found', {n:n, r:rKm, 'new':found.added}) : t('foundNone', {r:rKm});
      st.className = n ? 'ok' : 'note';
      $('sort').value = 'best';
    }, function(err){
      persist();
      var m = err.message;
      st.textContent = err.status === 0 ? t('eNet') : err.status === 403 ? t('e403') : err.status === 429 ? t('e429') : err.status === 400 ? t('e400', {m:m}) : t('eOther', {m:m});
      st.className = 'err';
    }).then(function(){
      searching = false; $('findBtn').disabled = false;
      $('progressBar').style.width = '100%';
      setTimeout(function(){ $('progress').hidden = true; $('progressBar').style.width = '0'; }, 600);
      renderFilters(); renderList();
    });
  });

  /* ---------- filters + list ---------- */
  function all(){ return Object.keys(offices).map(function(id){ return Object.assign({id:id}, offices[id]); }); }
  function renderFilters(){
    var rows = all(), counts = {all:rows.length};

    rows.forEach(function(o){ counts[o.status || 'new']++; });

  function renderList(){
    var box = $('list'); box.innerHTML = '';

      var e = el('div','empty');

      e.appendChild(el('p', null, t('emptyP')));

    }
    var q = toLatin($('search').value.trim().toLowerCase());
    rows = rows.filter(function(o){
      if(filter !== 'all' && (o.status || 'new') !== filter) return false;
      return !q || [o.name, o.address, o.area, o.phone, localPhone(o.phone), o.notes].join(' ').toLowerCase().indexOf(q) !== -1;
    });
    var sort = $('sort').value;
    rows.sort(function(a, b){
      if(sort === 'status'){ var s = STATUS_ORDER[a.status||'new'] - STATUS_ORDER[b.status||'new']; if(s) return s; return score(b) - score(a); }
      if(sort === 'recent') return (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0);
      if(sort === 'rating') return ((b.rating||0) - (a.rating||0)) || ((b.reviews||0) - (a.reviews||0));
      if(sort === 'dist'){ var da = distOf(a), dbb = distOf(b); return (da == null ? 1e9 : da) - (dbb == null ? 1e9 : dbb); }
      return score(b) - score(a);
    });
    if(!rows.length){ box.appendChild(el('p','note', t('noResults'))); return; }
    var top = {};
    all().filter(function(o){ return o.phone && o.status !== 'declined'; }).sort(function(a, b){ return score(b) - score(a); }).slice(0, 5).forEach(function(o, i){ top[o.id] = i + 1; });
    rows.forEach(function(o){ box.appendChild(card(o, top[o.id])); });
  }

    sel.addEventListener('change', function(){ update(o.id, {status:sel.value}, t('statusSaved')); renderFilters(); renderList(); });

    notes.addEventListener('change', function(){ update(o.id, {notes:notes.value}, t('noteSaved')); });

      no.addEventListener('click', function(){ pendingDelete = null; renderList(); });
      del.appendChild(yes); del.appendChild(no);
    } else {
      var db = el('button','btn btn-ghost btn-sm', t('del')); db.type = 'button';
      db.addEventListener('click', function(){ pendingDelete = o.id; renderList(); });
      del.appendChild(db);
    }
    c.appendChild(del);
    return c;
  }

  /* ---------- manual add ---------- */
  $('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    var err = $('addErr'); err.hidden = true;
    var name = $('fName').value.trim();
    if(!name){ err.textContent = t('eName'); err.hidden = false; return; }
    var phone = normPhone($('fPhone').value);
    if($('fPhone').value.trim() && phone.length < 11){ err.textContent = t('ePhone'); err.hidden = false; return; }
    if(phone && all().some(function(o){ return o.phone === phone; })){ err.textContent = t('eDup'); err.hidden = false; return; }
    var mapUrl = $('fMap').value.trim(), coords = parseCoords(mapUrl);
    var rec = {name:name, phone:phone, area:$('fArea').value.trim(), mapUrl:/^https?:\/\//.test(mapUrl) ? mapUrl : '', notes:$('fNotes').value.trim(), status:'new', source:'manual', createdAt:Date.now()};
    if(coords){ rec.lat = coords.lat; rec.lng = coords.lng; }
    offices['m_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)] = rec;
    if(persist()){ $('addForm').reset(); toast(t('added')); }
    renderFilters(); renderList();
  });

  /* ---------- export ---------- */
  $('exportBtn').addEventListener('click', function(){
    var cols = ['Name','Phone','WhatsApp','Distance km','Rating','Reviews','Status','Notes','Address','Google Maps','Website'];
    var lines = [cols];
    all().sort(function(a, b){ return score(b) - score(a); }).forEach(function(o){
      var d = distOf(o);
      lines.push([o.name, localPhone(o.phone), isMobile(o.phone || '') ? 'https://wa.me/' + o.phone : '', d == null ? '' : d.toFixed(1), o.rating || '', o.reviews || '', T.en[statusOf(o.status).k], o.notes || '', o.address || o.area || '', o.mapUrl || '', o.website || '']);
    });
    var csv = '﻿' + lines.map(function(r){ return r.map(function(v){ v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    a.download = 'dammam-brokers-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    toast(t('exported'));
  });

  $('search').addEventListener('input', renderList);
  $('sort').addEventListener('change', renderList);

  renderTerms();
  applyLang();
  try{ if(sessionStorage.getItem(K_AUTH) === '1') showApp(); }catch(e){}
})();
</script>
</body>
</html>
