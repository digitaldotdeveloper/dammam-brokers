<style>
/* Layout: light only. White top bar with the logo, one column of contact cards, two big buttons per card. */
:root{
  color-scheme:light;
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef1f4;
  --ink:#1b2530; --ink-2:#4a5c73; --ink-3:#808c9c; --line:#e1e6ec;
  --lime:#b4da3c; --lime-ink:#1f2a08; --lime-text:#5f7d0e; --lime-soft:#f1f8dc;
  --call:#2f3d4e; --call-ink:#ffffff;
  --wa:#1f9d55; --wa-ink:#ffffff;
  --s-noanswer:#c27c0e; --s-interested:#1f9d55; --s-declined:#b8423a;
  --focus:#2f6fb8;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px; --r-sm:10px;
}
:root[dir="rtl"]{ --f-body:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,Tahoma,sans-serif; }
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.logo{height:30px;width:auto;display:block}
@media (max-width:380px){.logo{height:24px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-sm{min-height:36px;padding:4px 12px;font-size:.88rem}
.btn-primary{background:var(--lime);color:var(--lime-ink);border-color:transparent}
.btn-primary:hover{background:var(--lime);filter:brightness(.96)}
.btn svg{width:18px;height:18px;flex:none}
.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-height:44px}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px}
.login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 22px;display:grid;gap:14px}
.login-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.login-card h1{font-size:1.2rem;color:var(--ink-2);font-weight:600}
.field{display:grid;gap:6px}
.field label{font-size:.85rem;color:var(--ink-2);font-weight:500}
.err{color:var(--s-declined);font-size:.9rem;margin:0}

/* Top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:10px}
.top .tools{display:flex;gap:6px}

main .wrap{padding-block:16px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
main .wrap > *{min-width:0}
.summary{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.summary h1{font-size:1.2rem}
.stats{display:flex;gap:14px;font-size:.88rem;color:var(--ink-2)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Filters */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0;padding-block:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.88rem;font-weight:500;cursor:pointer;min-height:36px}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .n{opacity:.7;font-variant-numeric:tabular-nums;margin-inline-start:4px}
.bar select{min-height:36px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.88rem}

/* Cards */
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.card.top1{border-color:var(--lime-text);box-shadow:0 0 0 1px var(--lime-text) inset}
.c-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.c-name{font-size:1.02rem;font-weight:700;overflow-wrap:anywhere;min-width:0}
.pick{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;color:var(--lime-text);background:var(--lime-soft);border-radius:6px;padding:1px 7px;margin-bottom:4px}
.c-sub{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:.85rem;color:var(--ink-3);margin-top:2px}
.c-sub .star{color:var(--ink-2);font-weight:600}
.c-sub .done{color:var(--ink-2)}
.why{font-size:.88rem;color:var(--ink-2);margin:4px 0 0}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:.75rem;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2)}
.badge.fal{background:var(--lime-soft);color:var(--lime-text)}
.links{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:.85rem}
.links a{color:var(--ink-2);font-weight:500;text-underline-offset:3px}
.dist{font-size:.9rem;font-weight:700;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.go{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px}
.go .btn{min-width:0;overflow:hidden}
.go .btn{min-height:50px;font-size:1rem;border:0}
.go .call{background:var(--call);color:var(--call-ink)}
.go .call:hover{background:var(--call);filter:brightness(1.15)}
.go .wa{background:var(--wa);color:var(--wa-ink)}
.go .wa:hover{background:var(--wa);filter:brightness(1.06)}
.go .map{background:var(--surface-2);color:var(--ink-2);padding-inline:14px}
.go .btn[aria-disabled="true"]{opacity:.35;pointer-events:none}
.go .cnt{font-size:.78rem;font-weight:600;background:rgba(255,255,255,.22);border-radius:999px;padding:0 7px;min-width:22px;text-align:center}
.result{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.res{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;cursor:pointer;min-height:34px;color:var(--ink-2)}
.res[aria-pressed="true"]{color:#fff;border-color:transparent;background:var(--c)}
.note-btn{margin-inline-start:auto;background:none;border:0;color:var(--ink-3);font-size:.85rem;cursor:pointer;padding:6px 4px;min-height:34px}
.note-btn.has{color:var(--ink-2);font-weight:600}
.note{width:100%;min-height:60px;resize:vertical;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;background:var(--surface-2)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--ink-2)}

/* Bottom: history, add, export */
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.more summary{cursor:pointer;padding:13px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:1.2rem;color:var(--ink-3)}
details.more[open] summary::after{content:"−"}
details.more .inner{padding:0 16px 16px;display:grid;gap:10px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:0}
.log li{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.log li:first-child{border-top:0}
.log time{color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.log .what{min-width:0;overflow-wrap:anywhere}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.foot{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
.toast span{background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:.9rem}
</style>
</head>
<body>

<div id="loginView" class="wrap login">
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="login-top">
      <img class="logo" src="assets/logo-dark.png" alt="EasyPak" width="769" height="232">
      <button class="btn btn-sm" type="button" data-lang-toggle></button>
    </div>
    <h1 data-i18n="appName"></h1>
    <div class="field"><label for="lu" data-i18n="user"></label><input class="input" id="lu" dir="ltr" autocapitalize="none" spellcheck="false"></div>
    <div class="field"><label for="lp" data-i18n="pass"></label><input class="input" id="lp" type="password" dir="ltr"></div>
    <p class="err" id="loginErr" data-i18n="loginErr" hidden></p>
    <button class="btn btn-primary" type="submit" data-i18n="signIn"></button>
  </form>
</div>

<div id="appView" hidden>
  <header class="top">
    <div class="wrap">
      <img class="logo" src="assets/logo-dark.png" alt="EasyPak" width="769" height="232">
      <div class="tools">
        <button class="btn btn-sm" type="button" data-lang-toggle></button>
        <button class="btn btn-sm" id="logout" type="button" data-i18n="signOut"></button>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="summary">
        <h1 data-i18n="h1"></h1>
        <div class="stats" id="stats"></div>
      </div>
      <div class="bar">
        <div class="tabs" id="tabs" role="group"></div>
      </div>
      <div class="list" id="list"></div>

      <details class="more" id="historyBox">
        <summary><span data-i18n="history"></span></summary>
        <div class="inner"><ul class="log" id="log"></ul></div>
      </details>

      <details class="more">
        <summary><span data-i18n="addSummary"></span></summary>
        <form class="inner" id="addForm">
          <div class="row2">
            <div class="field"><label for="fName" data-i18n="fName"></label><input class="input" id="fName" required></div>
            <div class="field"><label for="fPhone" data-i18n="fPhone"></label><input class="input num" id="fPhone" inputmode="tel" placeholder="05xxxxxxxx" required></div>
          </div>
          <p class="err" id="addErr" hidden></p>
          <button class="btn btn-primary" type="submit" data-i18n="saveOffice"></button>
        </form>
      </details>

      <div class="foot"><button class="btn btn-sm" id="exportBtn" type="button" data-i18n="export"></button></div>
    </div>
  </main>
</div>

<div class="toast" id="toast" hidden><span id="toastText"></span></div>

  }
  function when(ts){
    var d = new Date(ts), now = new Date();
    var loc = lang === 'ar' ? 'ar-SA-u-ca-gregory-nu-latn' : 'en-GB';
    var time = d.toLocaleTimeString(loc, {hour:'2-digit', minute:'2-digit'});
    if(d.toDateString() === now.toDateString()) return time;
    return d.toLocaleDateString(loc, {day:'numeric', month:'short'}) + ' ' + time;
  }
  function st(id){ return state[id] || (state[id] = {calls:0, was:0}); }
  // Google hides review counts from signed-out visitors, so rank on rating, warehouse/commercial focus, distance and a WhatsApp-able number.
  function score(o){
    if(o.rank && o.rank < 99) return 1000 - o.rank;
    var s = 0;
    if(o.rating) s += (o.rating - 3.5) * 2;
    if(FIT_RE.test(o.name + ' ' + (o.category || ''))) s += 6;
    if(/real estate/i.test(o.category || '')) s += 1.5;
    if(isMobile(o.phone)) s += 2;
    return s - (o.d || 0) * 0.6;
  }
  var toastTimer;
  function toast(msg){ $('toastText').textContent = msg; $('toast').hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function(){ $('toast').hidden = true; }, 2000); }

  function record(o, action, extra){
    var s = st(o.id);
    if(action === 'call'){ s.calls = (s.calls || 0) + 1; s.lastAt = Date.now(); }
    if(action === 'wa'){ s.was = (s.was || 0) + 1; s.lastAt = Date.now(); }
    log.unshift({t:Date.now(), id:o.id, name:o.name, a:action, x:extra || ''});
    save();
  }

  /* ---------- data ---------- */
  function offices(){ return places.concat(manual).filter(function(o){ return o.phone; }); }
  function inRange(){ return true; }
  function inTab(o, which){
    var s = state[o.id] || {};
    if(which === 'all') return true;
    if(which === 'todo') return !s.calls && !s.was && !s.result;
    return s.result === which;
  }

  function loadData(){
    fetch('data.json?t=' + Date.now(), {cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){
      places = (j.places || []).map(function(p){
        var o = {id:'g_' + String(p.id).replace(/[^\w:.-]/g, ''), name:p.name, phone:normPhone(p.phone), rating:p.rating,
          lat:p.lat, lng:p.lng, mapUrl:p.mapUrl, category:p.category || '', fal:p.fal || null, commercial:!!p.commercial, fromAd:!!p.fromAd,
          why:p.why || null, links:p.links || {}, rank:p.rank || 99};
        o.d = (typeof o.lat === 'number') ? km(BRANCH, o) : null;
        return o;
      });
      loadState = 'ok';
    }).catch(function(){ loadState = 'err'; }).then(render);
  }

  /* ---------- render ---------- */
  function render(){
    var inR = offices().filter(inRange);
    var contacted = 0, interested = 0;
    inR.forEach(function(o){ var s = state[o.id] || {}; if(s.calls || s.was) contacted++; if(s.result === 'interested') interested++; });
    var stats = $('stats'); stats.innerHTML = '';
    [[inR.length, 'statOffices'], [contacted, 'statContacted'], [interested, 'statInterested']].forEach(function(x){
      var sp = el('span'); sp.appendChild(el('b', null, String(x[0]))); sp.appendChild(document.createTextNode(' ' + t(x[1]))); stats.appendChild(sp);
    });

    var tabs = $('tabs'); tabs.innerHTML = '';
    TABS.forEach(function(x){
      var n = inR.filter(function(o){ return inTab(o, x.id); }).length;
      var b = el('button', 'tab', t(x.k)); b.type = 'button';
      b.setAttribute('aria-pressed', tab === x.id ? 'true' : 'false');
      b.appendChild(el('span', 'n', String(n)));
      b.addEventListener('click', function(){ tab = x.id; render(); });
      tabs.appendChild(b);
    });

    var list = $('list'); list.innerHTML = '';
    if(loadState !== 'ok' && !manual.length){ list.appendChild(el('div', 'empty', t(loadState === 'err' ? 'loadErr' : 'loading'))); renderLog(); return; }
    var ranked = inR.slice().sort(function(a, b){ return score(b) - score(a); });
    var topRank = {};
    ranked.filter(function(o){ return (state[o.id] || {}).result !== 'declined'; }).slice(0, 5).forEach(function(o, i){ topRank[o.id] = i + 1; });
    var rows = ranked.filter(function(o){ return inTab(o, tab); });
    if(!rows.length) list.appendChild(el('div', 'empty', t('empty')));
    rows.forEach(function(o){ list.appendChild(card(o, topRank[o.id])); });
    renderLog();
  }

  function card(o, rank){
    var s = state[o.id] || {};
    var c = el('article', 'card' + (rank ? ' top1' : ''));

    var head = el('div', 'c-head');
    var left = el('div'); left.style.minWidth = '0';
    if(rank) left.appendChild(el('span', 'pick', '★ ' + t('top', {n:rank})));
    left.appendChild(el('h3', 'c-name', o.name));
    var sub = el('div', 'c-sub');
    if(o.rating) sub.appendChild(el('span', 'star', '★ ' + o.rating.toFixed(1)));
    sub.appendChild(el('span', 'num', localPhone(o.phone)));
    if(s.calls) sub.appendChild(el('span', 'done', t('called', {n:s.calls})));
    if(s.was) sub.appendChild(el('span', 'done', t('messaged', {n:s.was})));
    if(s.lastAt) sub.appendChild(el('span', null, t('last', {d:when(s.lastAt)})));
    left.appendChild(sub);
    if(o.why) left.appendChild(el('p', 'why', o.why[lang] || o.why.en));
    if(o.fal || o.commercial || o.fromAd){
      var bd = el('div', 'badges');
      if(o.fal) bd.appendChild(el('span', 'badge fal num', t('fal', {n:o.fal})));
      if(o.commercial) bd.appendChild(el('span', 'badge', t('commercial')));
      if(o.fromAd) bd.appendChild(el('span', 'badge', t('fromAd')));
      left.appendChild(bd);
    }
    head.appendChild(left);
    if(o.d != null) head.appendChild(el('span', 'dist', (o.d < 10 ? o.d.toFixed(1) : Math.round(o.d)) + ' ' + t('km')));
    c.appendChild(head);

    var go = el('div', 'go');
    var call = el('a', 'btn call'); call.href = /^966(9200|800)/.test(o.phone) ? 'tel:' + localPhone(o.phone) : 'tel:+' + o.phone;
    call.innerHTML = ICON_CALL; call.appendChild(document.createTextNode(t('call')));
    if(s.calls) call.appendChild(el('span', 'cnt', String(s.calls)));
    call.addEventListener('click', function(){ record(o, 'call'); setTimeout(render, 300); });
    var wa = el('a', 'btn wa'); wa.href = 'https://wa.me/' + o.phone; wa.target = '_blank'; wa.rel = 'noopener';
    wa.innerHTML = ICON_WA; wa.appendChild(document.createTextNode(t('wa')));
    if(s.was) wa.appendChild(el('span', 'cnt', String(s.was)));
    if(!isMobile(o.phone)) wa.setAttribute('aria-disabled', 'true');
    wa.addEventListener('click', function(){ record(o, 'wa'); setTimeout(render, 300); });
    var map = el('a', 'btn map'); map.target = '_blank'; map.rel = 'noopener'; map.setAttribute('aria-label', t('map'));
    map.href = o.mapUrl || ('https://www.google.com/maps/search/' + encodeURIComponent(o.name + ' الدمام'));
    map.innerHTML = ICON_MAP;
    go.appendChild(call); go.appendChild(wa); go.appendChild(map);
    c.appendChild(go);

    var lk = o.links || {}, names = [['website', 'Website'], ['instagram', 'Instagram'], ['x', 'X'], ['snapchat', 'Snapchat'], ['tiktok', 'TikTok'], ['facebook', 'Facebook']];
    var lrow = el('div', 'links');
    names.forEach(function(n){ if(lk[n[0]] && /^https?:\/\//.test(lk[n[0]])){ var a = el('a', null, n[1] + ' ↗'); a.href = lk[n[0]]; a.target = '_blank'; a.rel = 'noopener'; lrow.appendChild(a); } });
    if(lrow.childNodes.length) c.appendChild(lrow);

    var res = el('div', 'result');
    RESULTS.forEach(function(r){
      var b = el('button', 'res', t(r.k)); b.type = 'button';
      b.style.setProperty('--c', r.c);
      b.setAttribute('aria-pressed', s.result === r.id ? 'true' : 'false');
      b.addEventListener('click', function(){
        var cur = st(o.id);
        if(cur.result === r.id){ delete cur.result; record(o, 'cleared'); }
        else { cur.result = r.id; record(o, r.id); }
        toast(t('saved')); render();
      });
      res.appendChild(b);
    });
    var nb = el('button', 'note-btn' + (s.note ? ' has' : ''), s.note ? t('noteEdit') : t('note')); nb.type = 'button';
    nb.addEventListener('click', function(){ openNote = openNote === o.id ? null : o.id; render(); });
    res.appendChild(nb);
    c.appendChild(res);

    if(openNote === o.id){
      var ta = el('textarea', 'note'); ta.value = s.note || ''; ta.placeholder = t('notePh'); ta.id = 'note-' + o.id;
      ta.addEventListener('change', function(){
        var cur = st(o.id);
        if(ta.value.trim() === (cur.note || '')) return;
        cur.note = ta.value.trim(); record(o, 'note', cur.note); toast(t('saved'));
      });
      c.appendChild(ta);
      setTimeout(function(){ ta.focus(); }, 0);
    }
    return c;
  }

  var ACTION_KEY = {call:'aCall', wa:'aWa', noanswer:'aNoanswer', interested:'aInterested', declined:'aDeclined', cleared:'aCleared', note:'aNote', added:'aAdded'};
  function renderLog(){
    var ul = $('log'); ul.innerHTML = '';
    if(!log.length){ ul.appendChild(el('li', null, t('historyEmpty'))); return; }
    log.slice(0, 100).forEach(function(e){
      var li = el('li');
      li.appendChild(el('time', null, when(e.t)));
      var w = el('span', 'what');
      w.appendChild(el('b', null, t(ACTION_KEY[e.a] || e.a)));
      w.appendChild(document.createTextNode(' · ' + e.name + (e.x ? ' — ' + e.x : '')));
      li.appendChild(w); ul.appendChild(li);
    });
  }

  /* ---------- language + login ---------- */
  function applyLang(){
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(function(n){ n.textContent = t(n.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-lang-toggle]').forEach(function(b){ b.textContent = t('langBtn'); b.lang = lang === 'en' ? 'ar' : 'en'; });
    render();
  }
  document.querySelectorAll('[data-lang-toggle]').forEach(function(b){
    b.addEventListener('click', function(){ lang = lang === 'en' ? 'ar' : 'en'; lsSet(K_LANG, lang); applyLang(); });
  });
  function showApp(){ $('loginView').hidden = true; $('appView').hidden = false; }
  $('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    if($('lu').value.trim().toLowerCase() === USER && $('lp').value === PASS){ lsSet(K_AUTH, '1'); $('loginErr').hidden = true; showApp(); }
    else { $('loginErr').hidden = false; $('lp').value = ''; $('lp').focus(); }
  });
  $('logout').addEventListener('click', function(){ lsSet(K_AUTH, null); $('appView').hidden = true; $('loginView').hidden = false; $('lp').value = ''; });

  /* ---------- add + export ---------- */
  $('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    var err = $('addErr'); err.hidden = true;
    var name = $('fName').value.trim(), phone = normPhone($('fPhone').value);
    if(!name){ err.textContent = t('eName'); err.hidden = false; return; }
    if(phone.length < 11){ err.textContent = t('ePhone'); err.hidden = false; return; }
    if(offices().some(function(o){ return o.phone === phone; })){ err.textContent = t('eDup'); err.hidden = false; return; }
    var o = {id:'m_' + Date.now().toString(36), name:name, phone:phone, d:null};
    manual.push(o); record(o, 'added');
    $('addForm').reset(); toast(t('added')); render();
  });
  $('exportBtn').addEventListener('click', function(){
    var rows = [['Name','Phone','WhatsApp','Distance km','Rating','Calls','WhatsApp opened','Last contact','Result','Note','Google Maps']];
    offices().sort(function(a, b){ return score(b) - score(a); }).forEach(function(o){
      var s = state[o.id] || {};
      rows.push([o.name, localPhone(o.phone), isMobile(o.phone) ? 'https://wa.me/' + o.phone : '', o.d == null ? '' : o.d.toFixed(1), o.rating || '',
        s.calls || 0, s.was || 0, s.lastAt ? new Date(s.lastAt).toLocaleString('en-GB') : '', s.result || '', s.note || '', o.mapUrl || '']);
    });
    var csv = '﻿' + rows.map(function(r){ return r.map(function(v){ v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    a.download = 'easypak-brokers-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    toast(t('exported'));
  });
  window.addEventListener('storage', function(e){
    if(e.key === K_DATA || e.key === K_LOG){ state = readJSON(K_DATA, {}); log = readJSON(K_LOG, []); render(); }
  });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) render(); });

  applyLang();
  if(lsGet(K_AUTH) === '1') showApp();
  loadData();
})();
</script>
</body>
</html>
